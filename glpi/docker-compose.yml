name: glpi
services:
  glpi:
    image: glpi/glpi:latest
    restart: unless-stopped
    volumes:
      - ./storage/glpi:/var/glpi:rw
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
  db:
    image: mysql:8.4
    restart: unless-stopped
    volumes:
      - ./storage/mysql:/var/lib/mysql
    env_file: .env
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
